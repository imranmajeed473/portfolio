<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.description %}
  <meta name="description" content="{{ page.description | escape }}">
  {% endif %}
  <meta name="robots" content="index, follow">
  <title>{% if page.meta_title %}{{ page.meta_title | escape }}{% elsif page.title %}{{ page.title | escape }} | Imran Majeed{% else %}Imran Majeed{% endif %}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page.meta_title %}{{ page.meta_title | escape }}{% elsif page.title %}{{ page.title | escape }}{% else %}Imran Majeed{% endif %}">
  {% if page.description %}<meta property="og:description" content="{{ page.description | escape }}">{% endif %}
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/css/styles.css' | relative_url }}">
</head>
<body id="page-top">
  <nav class="navbar navbar-dark bg-primary fixed-top p-3">
    <a class="navbar-brand" href="{{ '/' | relative_url }}">Imran Majeed</a>
    <a class="nav-link text-white" href="{{ '/blog/' | relative_url }}">Blog</a>
  </nav>
  <main class="container-fluid p-0">
    {{ content }}
  </main>
</body>
</html>
